<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "neo-yellow": "#FFD600",
                        "neo-blue": "#2F5CFF",
                        "neo-dark": "#000000",
                        "neo-offwhite": "#F8F8F8",
                        "neo-cream": "#FDF6E9",
                    },
                    fontFamily: {

                        "serif": ["DM Serif Display", "serif"],

                        "neo-sm": "3px 3px 0px 0px #000000",
                        "inner-glow": "inset 0 2px 0 0 rgba(255,255,255,0.4), inset 0 -2px 0 0 rgba(0,0,0,0.1)",
                        "inner-glow-white": "inset 0 2px 0 0 rgba(255,255,255,1), inset 0 -2px 0 0 rgba(0,0,0,0.05)"
                    }
                },
            },
        }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Public+Sans:wght@500;700;800&amp;family=DM+Serif+Display&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <style>
        body {
            min-height: max(884px, 100dvh);
            background-image: radial-gradient(#000 1px, transparent 1px);
            background-size: 24px 24px;
            background-color: #F8F8F8;
            overflow: hidden;
            /* Prevent scrolling if possible */
        }

        .bg-grid-pattern {
            background-image:
                linear-gradient(to right, rgba(0, 0, 0, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.15) 1px, transparent 1px);
            background-size: 20px 20px;
        }

</head>

<body class="font-body text-neo-dark min-h-screen flex items-center justify-center p-6 antialiased">
    <main
        class="w-full max-w-sm mx-auto flex flex-col h-auto justify-center gap-8 relative bg-neo-cream bg-grid-pattern border-4 border-black shadow-neo rounded-3xl p-6 py-12 pb-8 overflow-hidden">
        <div class="flex flex-col items-center pt-12 space-y-8 flex-grow justify-center relative z-10">
            <div class="text-center space-y-6">
                <h1 class="text-7xl font-serif tracking-tight text-neo-dark drop-shadow-sm leading-[0.9]"
                    style="text-shadow: 2px 2px 0px white;">
                    Study<br />Forged
                </h1>
                <p
                    class="text-neo-dark font-black text-sm uppercase tracking-wider w-full mx-auto leading-tight bg-white border-2 border-black px-6 py-4 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] rounded-lg">
                    Study Planning Forge
                </p>
            </div>
        </div>
        <div class="w-full space-y-5 pb-4 relative z-10">
            <button id="bypassLoginBtn"
                class="w-full h-16 bg-neo-blue text-white font-black text-lg rounded-xl border-4 border-black shadow-neo flex items-center justify-center transition-all duration-200 active:translate-x-[2px] active:translate-y-[2px] active:shadow-none shadow-inner-glow cursor-pointer hover:bg-blue-600">
                <span>One-Click Login (Bypass)</span>
            </button>
            <div class="relative py-4">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t-4 border-black border-dashed"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span
                        class="px-2 bg-neo-cream border-2 border-black font-bold rounded shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">OR</span>
                </div>
            </div>
            <div class="text-center">
                <p class="text-sm font-bold text-neo-dark">
                    Don't have an account?
                    <a class="inline-block bg-white text-neo-blue border-2 border-black px-2 py-0.5 ml-1 rounded shadow-[2px_2px_0px_0px_#000] hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-none transition-all font-black"
                        href="#">Sign up</a>
                </p>
            </div>
        </div>
        <div class="text-center pb-2 relative z-10">
            <p class="text-xs font-bold text-neo-dark/70 leading-tight max-w-xs mx-auto">
                By continuing, you acknowledge our
                <a class="underline decoration-2 decoration-black hover:bg-black hover:text-white transition-colors px-0.5"
                    href="#">Terms of Service</a>
                and
                <a class="underline decoration-2 decoration-black hover:bg-black hover:text-white transition-colors px-0.5"
                    href="#">Privacy Policy</a>.
            </p>
        </div>
    </main>

    <script>
        // Simple login logic for handling redirects
        const API_DELAY = 500; // Faster for bypass

        function handleLogin() {
            console.log(`Logging in via bypass...`);

            setTimeout(() => {
                // Set login flag in localStorage
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userEmail', 'satyam@adgips');

                // Redirect to main app
                window.location.href = 'index.html';
            }, API_DELAY);
        }

        document.getElementById('bypassLoginBtn').addEventListener('click', handleLogin);
    </script>
</body>

</html>
